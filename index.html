<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밍쑨 노래 빙고</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',-apple-system,sans-serif;}
:root{
  --blue:#2563eb;--blue-lt:#dbeafe;--blue-md:#93c5fd;--blue-dk:#1d4ed8;--blue-xl:#eff6ff;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g800:#1f2937;
  --amber:#f59e0b;--amber-lt:#fef3c7;--amber-md:#fde68a;
  --green:#059669;--green-lt:#d1fae5;
  --red:#dc2626;--red-lt:#fee2e2;
}
body{background:#f8fafc;min-height:100vh;color:var(--g800);}
header{background:white;border-bottom:1px solid var(--g200);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{font-size:18px;font-weight:600;letter-spacing:-.3px;}
.logo em{color:var(--blue);font-style:normal;}
.btn-sm{font-size:13px;padding:6px 14px;border:1px solid var(--g200);border-radius:8px;background:transparent;color:var(--g600);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.btn-sm:hover{background:var(--g100);}
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px;}

/* 상태 바 */
.statusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:white;border:1px solid var(--g200);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;}
.pill.lock{background:var(--g100);color:var(--g600);}
.pill.open{background:var(--green-lt);color:var(--green);}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.pill.open .dot{animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.25}}
.linecount{margin-left:auto;font-size:14px;color:var(--g600);}
.linecount b{font-size:20px;color:var(--g800);font-weight:800;margin:0 2px;}
.guide{font-size:13px;color:var(--blue-dk);background:var(--blue-xl);border:1px solid var(--blue-lt);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none;line-height:1.5;}
.guide.show{display:block;}

/* 보상 */
.rewards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.rw{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--g200);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--g600);}
.rw .n{font-weight:700;color:var(--g800);font-size:12px;background:var(--g100);border-radius:6px;padding:2px 7px;}
.rw.hit{border-color:var(--blue-md);background:var(--blue-xl);color:var(--blue-dk);}
.rw.hit .n{background:var(--blue);color:white;}
.rw.final{border-color:var(--amber-md);background:#fffbeb;color:#92400e;font-weight:600;}
.rw.final .n{background:var(--amber);color:white;}
.rw.final.hit{background:var(--amber);border-color:var(--amber);color:white;}
.rw.final.hit .n{background:white;color:#b45309;}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;}
@media(max-width:860px){.layout{grid-template-columns:1fr;}}

/* 빙고판 */
.board-wrap{background:white;border:1px solid var(--g200);border-radius:14px;padding:14px;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.cell{position:relative;aspect-ratio:1;border:1.5px solid var(--g200);border-radius:10px;background:var(--g50);padding:8px;display:flex;flex-direction:column;overflow:hidden;cursor:default;transition:border-color .12s,background .12s;}
.cell .cond{font-size:12px;font-weight:600;color:var(--g500);line-height:1.25;word-break:keep-all;}
.cell .song{margin-top:auto;font-size:13px;font-weight:700;line-height:1.25;color:var(--g800);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;}
.cell .artist{font-size:11px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell.placed{background:white;border-color:var(--blue-md);}
.cell.checked{background:var(--blue);border-color:var(--blue);}
.cell.checked .cond{color:rgba(255,255,255,.75);}
.cell.checked .song{color:white;}
.cell.checked .artist{color:rgba(255,255,255,.75);}
.cell .stamp{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:white;color:var(--blue);display:none;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.cell.checked .stamp{display:flex;}
.cell.target{border-style:dashed;border-color:var(--blue);background:var(--blue-xl);}
.cell.pickable{cursor:pointer;}
.cell.pickable:hover{border-color:var(--blue);}
.board-empty{text-align:center;color:var(--g400);font-size:14px;padding:60px 0;}
@media(max-width:560px){
  .board-wrap{padding:8px;}
  .board{gap:4px;}
  .cell{padding:5px;border-radius:7px;}
  .cell .cond{font-size:10px;}
  .cell .song{font-size:11px;}
  .cell .artist{display:none;}
  .cell .stamp{width:16px;height:16px;font-size:10px;top:3px;right:3px;}
}

/* 노래 풀 */
.pool{background:white;border:1px solid var(--g200);border-radius:14px;padding:14px;position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;}
@media(max-width:860px){.pool{position:static;max-height:none;}}
.pool h2{font-size:15px;font-weight:700;margin-bottom:2px;}
.pool .sub{font-size:12px;color:var(--g400);margin-bottom:10px;}
.search{width:100%;padding:9px 12px;border:1px solid var(--g200);border-radius:8px;font-size:14px;font-family:inherit;background:var(--g50);outline:none;}
.search:focus{border-color:var(--blue);background:white;}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0;}
.tag{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--g200);background:white;color:var(--g600);cursor:pointer;font-family:inherit;}
.tag.on{background:var(--g800);border-color:var(--g800);color:white;}
.songs{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:120px;}
@media(max-width:860px){.songs{max-height:420px;}}
.song-item{border:1px solid var(--g200);border-radius:9px;padding:9px 11px;background:white;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;display:flex;align-items:center;gap:10px;}
.song-item:hover{border-color:var(--blue-md);}
.song-item.sel{border-color:var(--blue);background:var(--blue-xl);box-shadow:0 0 0 2px var(--blue-lt);}
.song-item .grip{color:var(--g300);font-size:14px;letter-spacing:-2px;}
.song-item .t{font-size:14px;font-weight:600;line-height:1.3;}
.song-item .a{font-size:12px;color:var(--g500);}
.song-item .tg{font-size:11px;color:var(--g400);margin-top:2px;}
.song-item .badge{margin-left:auto;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;}
.song-item.off{cursor:not-allowed;background:var(--g50);}
.song-item.off .t{color:var(--g400);}
.song-item.off.used .t{text-decoration:line-through;}
.badge.used{background:var(--g200);color:var(--g600);}
.badge.onboard{background:var(--blue-lt);color:var(--blue-dk);}
.empty{font-size:13px;color:var(--g400);text-align:center;padding:24px 0;}

/* 드래그 고스트 */
.ghost{position:fixed;z-index:200;pointer-events:none;background:var(--blue);color:white;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;box-shadow:0 8px 24px rgba(37,99,235,.35);transform:translate(-50%,-120%);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.overlay.hidden{display:none;}
.modal{background:white;border-radius:14px;padding:22px;width:100%;max-width:380px;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:10px;}
.modal p{font-size:14px;color:var(--g600);line-height:1.6;}
.modal p b{color:var(--g800);}
.mbtns{display:flex;gap:8px;margin-top:18px;}
.mbtns button{flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;}
.btn-cancel{background:var(--g100);border:1px solid var(--g200);color:var(--g600);}
.btn-confirm{background:var(--blue);border:none;color:white;}
.btn-confirm:hover{background:var(--blue-dk);}

/* 빙고 축하 */
.celebrate{background:white;border-radius:18px;padding:28px 24px;text-align:center;max-width:340px;width:100%;}
.celebrate .big{font-size:40px;font-weight:900;color:var(--blue);letter-spacing:-1px;}
.celebrate.final .big{color:var(--amber);}
.celebrate .rtext{margin-top:8px;font-size:15px;color:var(--g600);}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g800);color:white;font-size:14px;padding:10px 16px;border-radius:10px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
@media(prefers-reduced-motion:reduce){.pill.open .dot{animation:none;}}

/* 빙고 줄 표시 */
.board{position:relative;}
.bingo-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3;}
.bingo-log{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.bingo-log:empty{display:none;}
.blog{display:inline-flex;align-items:center;gap:7px;font-size:13px;background:var(--g50);border:1px solid var(--g200);border-radius:9px;padding:6px 10px;color:var(--g600);}
.blog .num{width:20px;height:20px;border-radius:50%;color:white;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.blog b{color:var(--g800);font-weight:700;}
.blog .rwt{color:var(--g500);}
.celebrate .line{margin-top:6px;font-size:14px;color:var(--g500);}

/* 태그 색 */
.tchip{display:inline-block;font-size:11px;font-weight:600;line-height:1.3;background:var(--tb);color:var(--tf);border-radius:6px;padding:2px 7px;margin:2px 4px 0 0;}
.tag[style]{background:var(--tb);color:var(--tf);border-color:var(--tl);font-weight:500;}
.tag[style]:hover{border-color:var(--tf);}
.tag.on[style]{background:var(--tb);color:var(--tf);border-color:var(--tf);box-shadow:inset 0 0 0 1px var(--tf);font-weight:700;}
.tag.on[style]::before{content:'✓ ';}
.song-item.off .tchip{opacity:.55;}
.cell .cond{align-self:flex-start;}
.song-item .tg{margin-top:1px;}

/* 부른 순서 */
.sung-wrap{background:white;border:1px solid var(--g200);border-radius:14px;padding:14px;margin-top:16px;}
.sung-wrap h2{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.sung-wrap h2 span{font-size:13px;font-weight:500;color:var(--g400);}
.sung-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin-top:10px;}
.sung{display:flex;align-items:center;gap:10px;border:1px solid var(--g200);border-radius:10px;padding:8px 10px;}
.sung .sn{width:24px;height:24px;border-radius:50%;background:var(--blue);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.sung .sbody{min-width:0;flex:1;}
.sung .stitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sung .sart{font-size:12px;font-weight:400;color:var(--g500);margin-left:6px;}
.sung .smeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.sung .scell{font-size:11px;color:var(--g600);background:var(--g100);border-radius:5px;padding:1px 6px;}
.sung .scell.out{color:var(--g400);}
.sung .sbingo{font-size:11px;font-weight:700;color:white;border-radius:5px;padding:1px 6px;}
.sung .stime{font-size:11px;color:var(--g400);flex:none;}
.sung-list .empty{grid-column:1/-1;}

/* 칸 선택/삭제 */
.cell.picked{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt);}
.cell .xdel{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;border:none;background:var(--g100);color:var(--g500);font-size:14px;line-height:20px;text-align:center;cursor:pointer;padding:0;z-index:4;font-family:inherit;}
.cell .xdel:hover{background:var(--red-lt);color:var(--red);}
.cell.movable{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.cell.placed .cond{padding-right:18px;}
.pool.droptarget{border-color:var(--red);box-shadow:0 0 0 3px var(--red-lt);}
.pool.droptarget::after{content:'여기에 놓으면 빙고판에서 빠져요';position:absolute;left:14px;right:14px;top:10px;background:var(--red);color:white;font-size:13px;font-weight:600;text-align:center;padding:8px;border-radius:8px;}
.pool{position:sticky;}
@media(max-width:860px){.pool{position:relative;}}
@media(max-width:560px){.cell .xdel{width:16px;height:16px;line-height:16px;font-size:11px;top:2px;right:2px;}}
.sung .sops{display:flex;gap:3px;flex:none;}
.sung .sops button{border:1px solid var(--g200);background:white;border-radius:6px;font-size:12px;width:26px;height:26px;cursor:pointer;color:var(--g600);font-family:inherit;padding:0;}
.sung .sops button:hover{background:var(--g100);}
.sung .sops button:disabled{opacity:.35;cursor:default;}
.sung .sops button.del:hover{background:var(--red-lt);color:var(--red);}

.mybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:white;border:1px solid var(--g200);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.mybar label{font-size:14px;font-weight:700;}
.mybar .nickin{flex:1;min-width:140px;max-width:260px;padding:9px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:15px;font-family:inherit;background:var(--g50);outline:none;}
.mybar .nickin:focus{border-color:var(--blue);background:white;}
.mybar .nickin.need{border-color:var(--amber);background:#fffbeb;}
.mybar .nickstate{font-size:13px;color:var(--g500);}
.btn-blue{background:var(--blue);color:white;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-blue:hover{background:var(--blue-dk);}
.btn-line{background:white;color:var(--g600);border:1px solid var(--g200);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-line:hover{background:var(--g100);}
.board-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.board-actions .spacer{flex:1;}
.shot-box{background:white;border-radius:14px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;}
.shot-box h3{font-size:16px;font-weight:700;margin-bottom:10px;}
.shot-box img{width:100%;border-radius:10px;border:1px solid var(--g200);display:block;}
.shot-box .note{font-size:12px;color:var(--g500);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <div class="logo">밍쑨 <em>노래</em> 빙고</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:11px;color:var(--g300);">v7</span><a href="admin.html" class="btn-sm">관리자</a></div>
</header>
<main>
  <div class="mybar">
    <label for="nick">내 닉네임</label>
    <input class="nickin" id="nick" maxlength="20" placeholder="닉네임을 적어 주세요" autocomplete="off">
    <button class="btn-blue" id="nickSave">저장</button>
    <span class="nickstate" id="nickState"></span>
  </div>

  <div class="statusbar">
    <span class="pill lock" id="lockPill"><span class="dot"></span>불러오는 중</span>
    <span class="linecount">내 빙고 <b id="lineNum">0</b>줄</span>
  </div>
  <div class="guide" id="guide">노래 목록에서 곡을 끌어 조건에 맞는 칸에 넣어 주세요. 넣은 곡은 끌어서 다른 칸으로 옮기거나, ×를 눌러 뺄 수 있어요.</div>
  <div class="rewards" id="rewards"></div>

  <div class="layout">
    <section class="board-wrap">
      <div class="board" id="board"><div class="board-empty" style="grid-column:1/-1">불러오는 중...</div></div>
      <div class="bingo-log" id="bingoLog"></div>
      <div class="board-actions">
        <button class="btn-blue" id="shotBtn">사진으로 저장</button>
        <span class="spacer"></span>
        <button class="btn-line" id="clearBtn">내 빙고판 비우기</button>
      </div>
    </section>
    <aside class="pool" id="pool">
      <h2>노래 목록</h2>
      <div class="sub">곡을 끌어서 칸에 놓거나, 곡을 누른 뒤 칸을 눌러 주세요.</div>
      <input class="search" id="search" placeholder="제목, 가수 검색">
      <div class="tags" id="tags"></div>
      <div class="songs" id="songs"><div class="empty">불러오는 중...</div></div>
    </aside>
  </div>

  <section class="sung-wrap">
    <h2>부른 순서 <span id="sungCount"></span></h2>
    <ol class="sung-list" id="sungLog"><div class="empty">불러오는 중...</div></ol>
  </section>
</main>

<div class="overlay hidden" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">확인</h3>
    <p id="confirmText"></p>
    <div class="mbtns">
      <button class="btn-cancel" id="confirmNo">취소</button>
      <button class="btn-confirm" id="confirmYes">확인</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="shotModal">
  <div class="shot-box">
    <h3>내 빙고판 사진</h3>
    <img id="shotImg" alt="내 빙고판">
    <div class="note">휴대폰에서는 사진을 길게 눌러 저장할 수도 있어요.</div>
    <div class="mbtns">
      <button class="btn-cancel" id="shotClose">닫기</button>
      <a class="btn-confirm" id="shotDl" style="text-align:center;text-decoration:none;padding:10px;border-radius:8px;font-size:14px;font-weight:500;flex:1;">사진 저장</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="celebModal">
  <div class="celebrate" id="celebBox">
    <div class="big" id="celebBig"></div>
    <div class="line" id="celebLine"></div>
    <div class="rtext" id="celebText"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAMKN1rwiMBrR0XFxUYH09M6yxPlQHhZhI",
  authDomain: "mingsoon-coupon.firebaseapp.com",
  projectId: "mingsoon-coupon",
  storageBucket: "mingsoon-coupon.firebasestorage.app",
  messagingSenderId: "306496994985",
  appId: "1:306496994985:web:8273eca34a761e356673b8"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── 공통: 빙고 줄 계산 ──
const LINES = [], LINE_NAMES = [];
for (let r = 0; r < 5; r++) { LINES.push([0,1,2,3,4].map(c => r*5+c)); LINE_NAMES.push(`가로 ${r+1}번째 줄`); }
for (let c = 0; c < 5; c++) { LINES.push([0,1,2,3,4].map(r => r*5+c)); LINE_NAMES.push(`세로 ${c+1}번째 줄`); }
LINES.push([0,6,12,18,24], [4,8,12,16,20]); LINE_NAMES.push('대각선 ↘', '대각선 ↙');
const ORD = ['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두'];
const ordLabel = n => `${ORD[n-1] || n} 번째 빙고`;
const LINE_COLORS = ['#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1','#14b8a6','#e11d48','#0ea5e9'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// 완성된 줄을 완성된 순서대로 (그 줄의 마지막 체크 시각 기준)
function bingoOrder(cells) {
  const t = c => (c && c.checkedAt && c.checkedAt.toMillis) ? c.checkedAt.toMillis() : 0;
  return LINES.map((l, li) => ({ li, cells: l, done: l.every(i => cells[i] && cells[i].checked), at: Math.max(...l.map(i => t(cells[i]))) }))
    .filter(x => x.done)
    .sort((a, b) => a.at - b.at || a.li - b.li)
    .map((x, k) => ({ ...x, n: k + 1, color: LINE_COLORS[k % LINE_COLORS.length] }));
}

// 빙고판 위에 줄 긋기 + 번호
function drawBingoLines(boardEl, order) {
  let svg = boardEl.querySelector('.bingo-svg');
  if (!svg) { svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'bingo-svg'); boardEl.appendChild(svg); }
  const cellsEl = boardEl.querySelectorAll('.cell');
  if (cellsEl.length < 25 || !order.length) { svg.innerHTML = ''; return; }
  const br = boardEl.getBoundingClientRect();
  const ctr = i => { const r = cellsEl[i].getBoundingClientRect(); return [r.left - br.left + r.width/2, r.top - br.top + r.height/2, r.width]; };
  svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);
  let out = '';
  order.forEach(o => {
    const [x1, y1, w] = ctr(o.cells[0]), [x2, y2] = ctr(o.cells[4]);
    const sw = Math.max(4, w * 0.07);
    out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.color}" stroke-width="${sw}" stroke-linecap="round" opacity=".6"/>`;
  });
  // 번호는 줄 위에 따로 (줄 시작점에서 살짝 안쪽)
  order.forEach(o => {
    const [x1, y1, w] = ctr(o.cells[0]), [x2, y2] = ctr(o.cells[4]);
    const k = 0.12, bx = x1 + (x2 - x1) * k, by = y1 + (y2 - y1) * k;
    const r = Math.max(9, w * 0.14);
    out += `<circle cx="${bx}" cy="${by}" r="${r}" fill="${o.color}" stroke="white" stroke-width="2.5"/>
      <text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="central" fill="white" font-size="${r*1.15}" font-weight="800" font-family="Pretendard, sans-serif">${o.n}</text>`;
  });
  svg.innerHTML = out;
}

function renderBingoLog(el, order, rewards) {
  el.innerHTML = order.map(o => {
    const rw = (rewards || []).find(r => r.lines === o.n);
    return `<span class="blog"><span class="num" style="background:${o.color}">${o.n}</span><b>${ordLabel(o.n)}</b>${LINE_NAMES[o.li]}${rw ? `<span class="rwt">${rw.final ? '최종 보상' : '보상'} ${esc(rw.text || '')}</span>` : ''}</span>`;
  }).join('');
}

function renderRewardChips(el, rewards, n) {
  el.innerHTML = (rewards || []).slice().sort((a,b)=>a.lines-b.lines).map(r =>
    `<div class="rw${r.final?' final':''}${n>=r.lines?' hit':''}"><span class="n">${r.final?'최종 · ':''}${ordLabel(r.lines)}</span>${esc(r.text||'보상')}</div>`
  ).join('');
}

let celebTimer;
function celebrate(o, rewards) {
  const rw = (rewards || []).find(r => r.lines === o.n);
  $('celebBox').classList.toggle('final', !!(rw && rw.final));
  $('celebBig').textContent = (rw && rw.final) ? `최종 빙고!` : `${ordLabel(o.n)}!`;
  $('celebLine').textContent = (rw && rw.final ? `${ordLabel(o.n)} · ` : '') + LINE_NAMES[o.li];
  $('celebText').textContent = rw ? `보상: ${rw.text || ''}` : '';
  $('celebModal').classList.remove('hidden');
  clearTimeout(celebTimer); celebTimer = setTimeout(() => $('celebModal').classList.add('hidden'), 4000);
}

// ── 태그 색: 노래 목록에 등록된 순서대로 색상환을 골고루 나눠서 겹치지 않게 ──
const tagKey = t => String(t).toLowerCase().replace(/[\s\-_.·・]/g, '');
const TAG_IDX = new Map();
function setTagOrder(songs) {
  TAG_IDX.clear();
  const ts = s => (s.createdAt && s.createdAt.toMillis) ? s.createdAt.toMillis() : Number.MAX_SAFE_INTEGER;
  songs.slice().sort((a, b) => ts(a) - ts(b) || String(a.title).localeCompare(String(b.title), 'ko'))
    .forEach(s => (s.tags || []).forEach(t => { const k = tagKey(t); if (k && !TAG_IDX.has(k)) TAG_IDX.set(k, TAG_IDX.size); }));
}
function tagIndex(t) { const k = tagKey(t); if (!TAG_IDX.has(k)) TAG_IDX.set(k, TAG_IDX.size); return TAG_IDX.get(k); }
function tagVars(t) {
  const i = tagIndex(t);
  const h = Math.round((i * 137.508 + 12) % 360);   // 황금각: 몇 개가 되든 이웃 색과 최대한 멀어짐
  const tone = [[88, 91, 30], [70, 86, 28], [95, 94, 32]][Math.floor(i / 8) % 3]; // 8개마다 명도도 바꿔서 더 구분
  return `--tb:hsl(${h} ${tone[0]}% ${tone[1]}%);--tf:hsl(${h} 55% ${tone[2]}%);--tl:hsl(${h} 60% 74%)`;
}
const tagChip = t => `<span class="tchip" style="${tagVars(t)}">${esc(t)}</span>`;

// ── 개인 빙고판 계산 ──
const tms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
// 조건 25칸 + 곡 id 25개 → 칸 정보 (부른 곡이면 체크)
function composeCells(conds, ids, songMap) {
  return conds.map((c, i) => {
    const s = ids && ids[i] ? songMap.get(ids[i]) : null;
    return { cond: c.cond, songId: s ? s.id : null, song: s ? s.title : '', artist: s ? (s.artist || '') : '', checked: !!(s && s.used), checkedAt: s ? s.sungAt : null };
  });
}
// 부른 곡을 부른 순서대로
function sungList(songs) {
  return songs.filter(s => s.used).sort((a, b) => tms(a.sungAt) - tms(b.sungAt) || String(a.title).localeCompare(String(b.title), 'ko'));
}
const hhmm = ts => { const m = tms(ts); if (!m) return ''; const d = new Date(m); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
// 어떤 곡이 몇 번째 빙고를 완성했는지
function bingoMadeBy(cells, order) {
  const made = {};
  order.forEach(o => {
    const last = o.cells.reduce((m, i) => tms(cells[i].checkedAt) >= tms(cells[m].checkedAt) ? i : m, o.cells[0]);
    const sid = cells[last].songId; if (sid) (made[sid] = made[sid] || []).push(o);
  });
  return made;
}

// ── Firebase 오류를 알아보기 쉽게 ──
function fbErr(e) {
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) return '권한이 없어요. 빙고판이 잠겨 있거나 Firestore 규칙이 최신이 아니에요.';
  if (code.includes('unavailable')) return '인터넷 연결을 확인해 주세요.';
  return `오류: ${code || (e && e.message) || e}`;
}
window.addEventListener('unhandledrejection', ev => { console.error(ev.reason); toast(fbErr(ev.reason)); });


// ── 내 기기 정보 (빙고판 id, 닉네임) ──
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let boardId = store.get('msbingo-board-id');
if (!boardId || boardId.length < 16) {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  boardId = 'b' + [...a].map(x => x.toString(36).padStart(2, '0')).join('').slice(0, 23);
  store.set('msbingo-board-id', boardId);
}
const boardRef = doc(db, 'bingoBoards', boardId);

const S = { conds: [], songs: [], songMap: new Map(), meta: null, board: null, loaded: { conds: false, songs: false, board: false },
  nick: store.get('msbingo-nick') || '', q: '', tag: '전체', sel: null, prevCount: null };

const isOpen = () => !!S.meta && S.meta.locked === false;
const rewards = () => (S.meta && S.meta.rewards) || [];
const myIds = () => (S.board && Array.isArray(S.board.cells) && S.board.cells.length === 25) ? S.board.cells.slice() : Array(25).fill(null);
const cellsNow = () => composeCells(S.conds, myIds(), S.songMap);
function myIndexOf(songId) { return myIds().indexOf(songId); }
function ask(title, text, ok = '확인') {
  return new Promise(res => {
    $('confirmTitle').textContent = title; $('confirmText').innerHTML = text; $('confirmYes').textContent = ok;
    $('confirmModal').classList.remove('hidden');
    const done = v => { $('confirmModal').classList.add('hidden'); $('confirmYes').onclick = $('confirmNo').onclick = null; res(v); };
    $('confirmYes').onclick = () => done(true); $('confirmNo').onclick = () => done(false);
  });
}

// ── 닉네임 ──
$('nick').value = S.nick;
function renderNick() {
  $('nick').classList.toggle('need', !S.nick);
  $('nickState').textContent = S.nick ? '' : '닉네임을 적어야 빙고판을 채울 수 있어요.';
}
async function saveNick() {
  const v = $('nick').value.trim().slice(0, 20);
  if (!v) { toast('닉네임을 적어 주세요.'); $('nick').focus(); return; }
  if (S.board && v !== S.board.nick) {
    if (!isOpen()) { toast('빙고판이 잠겨 있어서 지금은 닉네임을 바꿀 수 없어요.'); $('nick').value = S.nick; return; }
    try { await setDoc(boardRef, { nick: v, cells: myIds(), updatedAt: serverTimestamp() }); }
    catch (e) { toast('닉네임을 저장하지 못했어요. ' + fbErr(e)); return; }
  }
  S.nick = v; store.set('msbingo-nick', v); renderNick(); $('nick').blur();
  toast(`${v}님, 반가워요!`);
}
$('nickSave').onclick = saveNick;
$('nick').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveNick(); } });

// ── 내 빙고판 저장 ──
function canEdit() {
  if (!isOpen()) { toast('지금은 빙고판이 잠겨 있어요.'); return false; }
  if (!S.nick) { toast('닉네임을 먼저 적고 저장해 주세요.'); $('nick').focus(); return false; }
  return true;
}
async function commit(ids) {
  S.board = { ...(S.board || {}), nick: S.nick, cells: ids };
  S.sel = null; renderAll();
  try { await setDoc(boardRef, { nick: S.nick, cells: ids, updatedAt: serverTimestamp() }); }
  catch (e) { console.error(e); toast('저장하지 못했어요. ' + fbErr(e)); }
}
function placeSong(idx, songId) {
  if (!canEdit()) return;
  const s = S.songMap.get(songId); if (!s) return;
  if (s.used) return toast('이미 부른 곡은 넣을 수 없어요.');
  const ids = myIds(), c = cellsNow()[idx];
  if (c.checked) return toast('이미 부른 칸은 바꿀 수 없어요.');
  const at = ids.indexOf(songId);
  if (at === idx) return;
  if (at !== -1) return moveCell(at, idx);
  ids[idx] = songId; commit(ids);
}
function moveCell(from, to) {
  if (!canEdit() || from === to) return;
  const ids = myIds(), cs = cellsNow();
  if (cs[from].checked || cs[to].checked) return toast('부른 곡이 있는 칸은 옮길 수 없어요.');
  [ids[from], ids[to]] = [ids[to], ids[from]];
  commit(ids);
}
function removeCell(idx) {
  if (!canEdit()) return;
  const ids = myIds(), c = cellsNow()[idx];
  if (!c.songId) return;
  if (c.checked) return toast('부른 곡은 뺄 수 없어요.');
  ids[idx] = null; commit(ids);
}
$('clearBtn').onclick = async () => {
  if (!canEdit()) return;
  const cs = cellsNow();
  if (!cs.some(c => c.songId && !c.checked)) return toast('뺄 곡이 없어요.');
  if (!await ask('내 빙고판 비우기', '아직 부르지 않은 곡을 전부 뺄까요? 부른 곡은 그대로 남아요.', '비우기')) return;
  commit(myIds().map((id, i) => cs[i].checked ? id : null));
};

// ── 렌더 ──
function renderStatus() {
  const pill = $('lockPill');
  if (!S.meta) { pill.className = 'pill lock'; pill.innerHTML = '<span class="dot"></span>준비 중'; }
  else if (isOpen()) { pill.className = 'pill open'; pill.innerHTML = '<span class="dot"></span>빙고판 채우는 중'; }
  else { pill.className = 'pill lock'; pill.innerHTML = '🔒 잠김'; }
  $('guide').classList.toggle('show', isOpen());
}
function renderBoard() {
  const b = $('board');
  if (S.loaded.conds && S.conds.length < 25) { b.innerHTML = '<div class="board-empty" style="grid-column:1/-1">빙고판을 준비하고 있어요.</div>'; return; }
  if (S.conds.length < 25) return;
  const cells = cellsNow(), open = isOpen();
  b.innerHTML = cells.map((c, i) => {
    const cls = ['cell'];
    const movable = open && c.songId && !c.checked;
    if (c.songId) cls.push('placed');
    if (c.checked) cls.push('checked');
    if (movable) cls.push('movable');
    if (S.sel && S.sel.from === 'cell' && S.sel.idx === i) cls.push('picked');
    else if (S.sel && open && !c.checked) cls.push('pickable');
    return `<div class="${cls.join(' ')}" data-idx="${i}">
      <div class="cond">${esc(c.cond)}</div>
      ${c.songId ? `<div class="song">${esc(c.song)}</div>${c.artist?`<div class="artist">${esc(c.artist)}</div>`:''}` : ''}
      <span class="stamp">✓</span>
      ${movable ? `<button class="xdel" data-x="${i}" aria-label="빼기">×</button>` : ''}
    </div>`;
  }).join('');
  const order = bingoOrder(cells);
  $('lineNum').textContent = order.length;
  renderRewardChips($('rewards'), rewards(), order.length);
  renderBingoLog($('bingoLog'), order, rewards());
  requestAnimationFrame(() => drawBingoLines(b, order));
}
function renderTags() {
  const set = new Set();
  S.songs.forEach(s => (s.tags||[]).forEach(t => set.add(t)));
  const list = ['전체', ...[...set].sort((a,b)=>a.localeCompare(b,'ko'))];
  if (!list.includes(S.tag)) S.tag = '전체';
  $('tags').innerHTML = list.length > 1 ? list.map(t => `<button class="tag${t===S.tag?' on':''}" data-tag="${esc(t)}"${t==='전체'?'':` style="${tagVars(t)}"`}>${esc(t)}</button>`).join('') : '';
}
function renderSongs() {
  const mine = new Set(myIds().filter(Boolean)), q = S.q.trim().toLowerCase();
  const list = S.songs.filter(s => {
    if (S.tag !== '전체' && !(s.tags||[]).includes(S.tag)) return false;
    if (q && !(`${s.title} ${s.artist||''}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b) => {
    const oa = a.used ? 2 : mine.has(a.id) ? 1 : 0, ob = b.used ? 2 : mine.has(b.id) ? 1 : 0;
    return oa - ob || a.title.localeCompare(b.title, 'ko');
  });
  const el = $('songs');
  if (!S.songs.length) { el.innerHTML = '<div class="empty">아직 등록된 곡이 없어요.</div>'; return; }
  if (!list.length) { el.innerHTML = '<div class="empty">검색 결과가 없어요.</div>'; return; }
  el.innerHTML = list.map(s => {
    const used = s.used, onb = mine.has(s.id), off = used || onb;
    const badge = used ? '<span class="badge used">부른 곡</span>' : onb ? '<span class="badge onboard">내 빙고판</span>' : '';
    return `<div class="song-item${off?' off':''}${used?' used':''}${S.sel&&S.sel.from==='pool'&&S.sel.id===s.id?' sel':''}" data-id="${s.id}">
      ${off ? '' : '<span class="grip">⋮⋮</span>'}
      <div style="min-width:0"><div class="t">${esc(s.title)}</div>${s.artist?`<div class="a">${esc(s.artist)}</div>`:''}${(s.tags&&s.tags.length)?`<div class="tg">${s.tags.map(tagChip).join('')}</div>`:''}</div>
      ${badge}
    </div>`;
  }).join('');
}
function renderSung() {
  const list = sungList(S.songs), cells = S.conds.length === 25 ? cellsNow() : [];
  const where = {}; cells.forEach(c => { if (c.songId) where[c.songId] = c; });
  const made = cells.length ? bingoMadeBy(cells, bingoOrder(cells)) : {};
  $('sungCount').textContent = list.length ? `${list.length}곡` : '';
  const el = $('sungLog');
  if (!list.length) { el.innerHTML = '<div class="empty">아직 부른 곡이 없어요.</div>'; return; }
  el.innerHTML = list.map((s, i) => {
    const c = where[s.id];
    return `<li class="sung"><span class="sn">${i + 1}</span>
      <div class="sbody"><div class="stitle">${esc(s.title)}${s.artist ? `<span class="sart">${esc(s.artist)}</span>` : ''}</div>
      <div class="smeta">${c ? `<span class="scell">내 빙고판 ${esc(c.cond)} 칸</span>` : '<span class="scell out">내 빙고판에 없음</span>'}${(made[s.id] || []).map(o => `<span class="sbingo" style="background:${o.color}">${ordLabel(o.n)}</span>`).join('')}</div></div>
      <span class="stime">${hhmm(s.sungAt)}</span></li>`;
  }).join('');
}
function checkCelebrate() {
  if (!S.loaded.conds || !S.loaded.songs || !S.loaded.board || S.conds.length < 25) return;
  const order = bingoOrder(cellsNow());
  if (S.prevCount !== null && order.length > S.prevCount) celebrate(order[order.length - 1], rewards());
  S.prevCount = order.length;
}
function renderAll() { renderNick(); renderStatus(); renderBoard(); renderTags(); renderSongs(); renderSung(); }
window.addEventListener('resize', () => { if (S.conds.length >= 25) drawBingoLines($('board'), bingoOrder(cellsNow())); });

$('search').addEventListener('input', e => { S.q = e.target.value; renderSongs(); });
$('tags').addEventListener('click', e => { const t = e.target.closest('.tag'); if (!t) return; S.tag = t.dataset.tag; renderTags(); renderSongs(); });

// ── 칸 누르기 (탭으로 넣기 / 옮기기 / 빼기) ──
let suppressClick = false;
$('board').addEventListener('click', e => {
  if (suppressClick) return;
  const x = e.target.closest('.xdel'); if (x) { removeCell(+x.dataset.x); return; }
  const cell = e.target.closest('.cell'); if (!cell) return;
  const idx = +cell.dataset.idx;
  if (S.sel && S.sel.from === 'pool') { placeSong(idx, S.sel.id); return; }
  if (S.sel && S.sel.from === 'cell') {
    if (S.sel.idx === idx) { S.sel = null; renderBoard(); renderSongs(); return; }
    moveCell(S.sel.idx, idx); return;
  }
  if (cell.classList.contains('movable')) { S.sel = { from: 'cell', idx }; renderBoard(); toast('옮길 칸을 누르거나, ×로 뺄 수 있어요.'); }
});

// ── 드래그 (마우스 + 터치 길게 누르기) ──
let drag = null, ghost = null, hover = null;
function startDrag(x, y) {
  drag.started = true;
  const title = drag.src === 'pool' ? (S.songMap.get(drag.id) || {}).title : cellsNow()[drag.idx].song;
  ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = title || '';
  document.body.appendChild(ghost);
  if (drag.src === 'cell') $('pool').classList.add('droptarget');
  moveDrag(x, y);
  if (navigator.vibrate) try { navigator.vibrate(15); } catch(_){}
}
function moveDrag(x, y) {
  ghost.style.left = x + 'px'; ghost.style.top = y + 'px';
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest('.cell');
  const next = cell || null;
  if (hover && hover !== next) hover.classList.remove('target');
  hover = next; if (hover) hover.classList.add('target');
  drag.overPool = !!(el && el.closest('#pool'));
}
function endDrag() {
  if (ghost) ghost.remove(); ghost = null;
  if (hover) hover.classList.remove('target'); hover = null;
  $('pool').classList.remove('droptarget');
  if (drag && drag.timer) clearTimeout(drag.timer); drag = null;
}
function beginPointer(e, info) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  drag = { ...info, x: e.clientX, y: e.clientY, started: false, type: e.pointerType, timer: null, overPool: false };
  if (e.pointerType !== 'mouse' && !info.off) drag.timer = setTimeout(() => { if (drag && !drag.started) startDrag(drag.x, drag.y); }, 220);
}
$('songs').addEventListener('pointerdown', e => {
  const item = e.target.closest('.song-item'); if (!item) return;
  beginPointer(e, { src: 'pool', id: item.dataset.id, off: item.classList.contains('off') });
});
$('board').addEventListener('pointerdown', e => {
  if (e.target.closest('.xdel')) return;
  const cell = e.target.closest('.cell.movable'); if (!cell) return;
  beginPointer(e, { src: 'cell', idx: +cell.dataset.idx, off: false });
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    const d = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
    if (drag.type === 'mouse') { if (d > 5 && !drag.off) startDrag(e.clientX, e.clientY); }
    else if (d > 10) endDrag();
    return;
  }
  moveDrag(e.clientX, e.clientY);
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag;
  if (d.started) {
    const to = hover ? +hover.dataset.idx : null, overPool = d.overPool;
    endDrag();
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    if (d.src === 'pool' && to !== null) placeSong(to, d.id);
    else if (d.src === 'cell' && to !== null) moveCell(d.idx, to);
    else if (d.src === 'cell' && overPool) removeCell(d.idx);
    return;
  }
  endDrag();
  if (d.src === 'pool') {
    if (d.off) { const s = S.songMap.get(d.id); toast(s && s.used ? '이미 부른 곡이에요.' : '이미 내 빙고판에 있는 곡이에요.'); return; }
    S.sel = (S.sel && S.sel.from === 'pool' && S.sel.id === d.id) ? null : { from: 'pool', id: d.id };
    renderSongs(); renderBoard();
    if (S.sel && !isOpen()) toast('지금은 빙고판이 잠겨 있어요.');
    else if (S.sel && !S.nick) { toast('닉네임을 먼저 적고 저장해 주세요.'); }
  }
});
window.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => { if (drag && drag.started) e.preventDefault(); }, { passive: false });
$('songs').addEventListener('contextmenu', e => e.preventDefault());
$('board').addEventListener('contextmenu', e => { if (e.target.closest('.movable')) e.preventDefault(); });
$('celebModal').onclick = () => $('celebModal').classList.add('hidden');

// ── 사진으로 저장 ──
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function wrapLines(ctx, text, maxW, maxLines) {
  const out = []; let line = '';
  for (const ch of String(text)) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch.trimStart(); if (out.length === maxLines) break; }
    else line += ch;
  }
  if (out.length < maxLines && line) out.push(line);
  if (out.length === maxLines && ctx.measureText(out.join('')).width < ctx.measureText(String(text)).width - 1) {
    let l = out[maxLines - 1]; while (l && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1); out[maxLines - 1] = l + '…';
  }
  return out;
}
async function makeShot() {
  if (S.conds.length < 25) return;
  try { await document.fonts.ready; } catch {}
  const cells = cellsNow(), order = bingoOrder(cells);
  const F = w => `${w} {S}px Pretendard, -apple-system, sans-serif`;
  const font = (w, s) => F(w).replace('{S}', s);
  const W = 1080, P = 56, G = 12, CS = (W - P*2 - G*4) / 5;
  const headH = 150, logH = order.length ? 40 + Math.ceil(order.length / 2) * 44 : 0;
  const H = P + headH + CS*5 + G*4 + logH + 70;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, W, H);
  // 머리
  ctx.fillStyle = '#1f2937'; ctx.font = font(700, 30); ctx.textBaseline = 'alphabetic';
  ctx.fillText('밍쑨 노래 빙고', P, P + 30);
  ctx.fillStyle = '#2563eb'; ctx.font = font(800, 56);
  let nick = S.nick || '이름 없음'; while (ctx.measureText(nick).width > W - P*2 - 260 && nick.length > 1) nick = nick.slice(0, -1);
  ctx.fillText(nick, P, P + 100);
  ctx.textAlign = 'right'; ctx.fillStyle = '#1f2937'; ctx.font = font(800, 56);
  ctx.fillText(`${order.length}줄`, W - P, P + 100);
  ctx.fillStyle = '#6b7280'; ctx.font = font(500, 24);
  const d = new Date(); ctx.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`, W - P, P + 30);
  ctx.textAlign = 'left';
  // 칸
  const top = P + headH, pos = i => [P + (i % 5) * (CS + G), top + Math.floor(i / 5) * (CS + G)];
  cells.forEach((c, i) => {
    const [x, y] = pos(i);
    rr(ctx, x, y, CS, CS, 18);
    ctx.fillStyle = c.checked ? '#2563eb' : (c.songId ? '#ffffff' : '#f3f4f6'); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = c.checked ? '#2563eb' : (c.songId ? '#93c5fd' : '#e5e7eb'); ctx.stroke();
    ctx.fillStyle = c.checked ? 'rgba(255,255,255,.8)' : '#6b7280'; ctx.font = font(700, 20);
    wrapLines(ctx, c.cond, CS - 28 - (c.checked ? 34 : 0), 2).forEach((l, k) => ctx.fillText(l, x + 14, y + 32 + k * 24));
    if (c.songId) {
      ctx.font = font(800, 26); ctx.fillStyle = c.checked ? '#ffffff' : '#1f2937';
      const tl = wrapLines(ctx, c.song, CS - 28, 2);
      const baseY = y + CS - 16 - (c.artist ? 26 : 0);
      tl.forEach((l, k) => ctx.fillText(l, x + 14, baseY - (tl.length - 1 - k) * 30));
      if (c.artist) { ctx.font = font(500, 19); ctx.fillStyle = c.checked ? 'rgba(255,255,255,.8)' : '#6b7280'; ctx.fillText(wrapLines(ctx, c.artist, CS - 28, 1)[0] || '', x + 14, y + CS - 14); }
    }
    if (c.checked) {
      ctx.beginPath(); ctx.arc(x + CS - 26, y + 26, 16, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
      ctx.moveTo(x + CS - 33, y + 26); ctx.lineTo(x + CS - 28, y + 32); ctx.lineTo(x + CS - 19, y + 20); ctx.stroke();
    }
  });
  // 빙고 줄
  const ctr = i => { const [x, y] = pos(i); return [x + CS/2, y + CS/2]; };
  order.forEach(o => {
    const [x1, y1] = ctr(o.cells[0]), [x2, y2] = ctr(o.cells[4]);
    ctx.globalAlpha = .6; ctx.strokeStyle = o.color; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.globalAlpha = 1;
  });
  order.forEach(o => {
    const [x1, y1] = ctr(o.cells[0]), [x2, y2] = ctr(o.cells[4]);
    const bx = x1 + (x2 - x1) * .12, by = y1 + (y2 - y1) * .12;
    ctx.beginPath(); ctx.arc(bx, by, 24, 0, Math.PI * 2); ctx.fillStyle = o.color; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = font(800, 26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(o.n), bx, by + 1); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  });
  // 빙고 기록
  let ly = top + CS*5 + G*4 + 48;
  order.forEach((o, k) => {
    const x = P + (k % 2) * ((W - P*2) / 2), y = ly + Math.floor(k / 2) * 44;
    ctx.beginPath(); ctx.arc(x + 14, y - 8, 14, 0, Math.PI * 2); ctx.fillStyle = o.color; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = font(800, 16); ctx.textAlign = 'center'; ctx.fillText(String(o.n), x + 14, y - 2); ctx.textAlign = 'left';
    ctx.fillStyle = '#1f2937'; ctx.font = font(700, 22); ctx.fillText(ordLabel(o.n), x + 38, y);
    ctx.fillStyle = '#6b7280'; ctx.font = font(500, 20); ctx.fillText(LINE_NAMES[o.li], x + 38 + ctx.measureText(ordLabel(o.n) + '  ').width + 10, y);
  });
  ctx.fillStyle = '#9ca3af'; ctx.font = font(500, 18); ctx.textAlign = 'center';
  ctx.fillText('mingsoon song bingo', W / 2, H - 28);
  return cv;
}
let shotUrl = null;
$('shotBtn').onclick = async () => {
  if (!S.nick) { toast('닉네임을 먼저 적어 주세요. 사진에 같이 들어가요.'); $('nick').focus(); return; }
  const cv = await makeShot(); if (!cv) return;
  cv.toBlob(blob => {
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = URL.createObjectURL(blob);
    $('shotImg').src = shotUrl;
    $('shotDl').href = shotUrl;
    $('shotDl').download = `밍쑨빙고_${S.nick}.png`;
    $('shotModal').classList.remove('hidden');
  }, 'image/png');
};
$('shotClose').onclick = () => $('shotModal').classList.add('hidden');

// ── 실시간 ──
onSnapshot(collection(db, 'bingoCells'), snap => {
  S.conds = snap.docs.map(d => ({ id: d.id, idx: d.data().idx, cond: d.data().cond })).sort((a,b) => a.idx - b.idx);
  S.loaded.conds = true; checkCelebrate(); renderAll();
}, err => { $('board').innerHTML = `<div class="board-empty" style="grid-column:1/-1">연결 오류: ${esc(fbErr(err))}</div>`; });

onSnapshot(collection(db, 'bingoSongs'), snap => {
  S.songs = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
  S.songMap = new Map(S.songs.map(s => [s.id, s]));
  setTagOrder(S.songs);
  if (S.sel && S.sel.from === 'pool' && !S.songMap.has(S.sel.id)) S.sel = null;
  S.loaded.songs = true; checkCelebrate(); renderAll();
});

onSnapshot(boardRef, snap => {
  S.board = snap.exists() ? snap.data() : null;
  if (S.board && S.board.nick && !S.nick) { S.nick = S.board.nick; $('nick').value = S.nick; store.set('msbingo-nick', S.nick); }
  S.loaded.board = true; checkCelebrate(); renderAll();
}, err => { console.error(err); toast('내 빙고판을 불러오지 못했어요. ' + fbErr(err)); S.loaded.board = true; });

onSnapshot(doc(db, 'bingoMeta', 'config'), snap => {
  S.meta = snap.exists() ? snap.data() : null;
  if (!isOpen()) S.sel = null;
  renderAll();
}, err => { console.error(err); toast('빙고판 상태를 불러오지 못했어요. ' + fbErr(err)); });
</script>
